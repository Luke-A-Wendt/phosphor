<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="PHOSPHOR. Eight minimal arcade games, one green phosphor screen.">
<title>PHOSPHOR</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="launcher" class="launcher">
  <button id="open-phosphor" class="launch-button" aria-label="Open Phosphor"><canvas id="launch-mark" width="192" height="48" aria-hidden="true"></canvas><span class="sr-only">OPEN PHOSPHOR</span></button>
</main>
<section id="arcade" class="arcade" data-mode="home" aria-label="Phosphor arcade" hidden>
  <div class="screen-wrap"><canvas id="screen" width="1024" height="768" tabindex="0" aria-label="PHOSPHOR game menu"></canvas><p id="fatal" hidden>Unable to initialize the display. Reload to try again.</p></div>
  <div class="touch-controls" aria-label="Arcade controller">
    <button id="menu-back" class="menu-back" aria-label="Back">ESC</button>
    <div id="joystick" class="joystick" role="group" aria-label="Movement joystick"><span class="joystick-center"></span><span class="joystick-stick"></span></div>
    <button id="action" class="action-button" aria-label="Action"><span></span></button>
  </div>
  <section id="rotate" class="rotate" aria-label="Rotate your phone" hidden><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="21" y="13" width="22" height="38" rx="4"/><path d="M11 30a22 22 0 0 1 38-15m0 0v-8m0 8h-8M53 34A22 22 0 0 1 15 49m0 0v8m0-8h8"/></svg><p>ROTATE TO LANDSCAPE</p></section>
  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
</section>
<script type="module" src="./app.js"></script>
</body>
</html>
