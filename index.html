<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="PHOSPHOR. Eight minimal arcade games, one green phosphor screen.">
<title>PHOSPHOR</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="launcher" class="launcher">
  <button id="open-phosphor" class="launch-button" aria-label="Click here"><span class="launch-art"><canvas id="launch-mark" width="1024" height="768" aria-hidden="true"></canvas></span><span id="launch-label" class="sr-only">CLICK HERE</span></button>
</main>
<section id="arcade" class="arcade" data-mode="home" aria-label="Phosphor arcade" hidden>
  <div class="landscape-stage">
  <div class="screen-wrap"><canvas id="screen" width="1024" height="768" tabindex="0" aria-label="PHOSPHOR game menu"></canvas><p id="fatal" hidden>Unable to initialize the display. Reload to try again.</p></div>
  <div id="touch-controls" class="touch-controls" aria-label="Arcade keyboard">
    <button id="menu-back" class="keycap escape-key" data-key="Escape" aria-label="Back"><span class="key-photo" aria-hidden="true"></span><span class="sr-only">ESC</span></button>
    <div class="arrow-keys" role="group" aria-label="Movement keys">
      <button id="key-up" class="keycap arrow-key key-up" data-key="ArrowUp" aria-label="Move up"><span class="key-photo" aria-hidden="true"></span></button>
      <button id="key-left" class="keycap arrow-key key-left" data-key="ArrowLeft" aria-label="Move left"><span class="key-photo" aria-hidden="true"></span></button>
      <button id="key-down" class="keycap arrow-key key-down" data-key="ArrowDown" aria-label="Move down"><span class="key-photo" aria-hidden="true"></span></button>
      <button id="key-right" class="keycap arrow-key key-right" data-key="ArrowRight" aria-label="Move right"><span class="key-photo" aria-hidden="true"></span></button>
    </div>
    <button id="action" class="keycap enter-key" data-key="Space" aria-label="Enter"><span class="key-photo" aria-hidden="true"></span><span class="sr-only">Enter</span></button>
  </div>
  </div>
  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
</section>
<script type="module" src="./app.js"></script>
</body>
</html>
